<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Apple Hide My Email — Quickstart</title>
    <style>
      :root {
        --bg-color: var(--background-dark, #1f2937);
      }
      :root.light {
        --bg-color: var(--background-light, #ffffff);
      }
      :root {
        --background-light: #ffffff;
        --background-dark: #1f2937;
      }
      html,
      body,
      #app-container {
        background-color: var(--bg-color);
        min-height: 100vh;
        margin: 0;
      }
    </style>
  </head>

  <body>
    <div id="app-container"></div>
    <script>
      // Initialize theme before React loads to prevent flash
      (async function initTheme() {
        try {
          const storage = await (chrome.storage || browser.storage).local.get(
            'theme'
          );
          const theme = storage.theme || 'dark';
          const isDark =
            theme === 'dark' ||
            (theme === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);

          const elements = [
            document.documentElement,
            document.body,
            document.getElementById('app-container'),
          ];
          elements.forEach((el) => {
            el?.classList.toggle('dark', isDark);
            el?.classList.toggle('light', !isDark);
          });
        } catch (e) {
          console.error('Failed to initialize theme:', e);
        }
      })();
    </script>
  </body>
</html>
