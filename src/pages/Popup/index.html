<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Apple Hide My Email</title>
    <style>
      html,
      body,
      #app-container {
        margin: 0;
        min-height: 100%;
        background: #f4f4f5;
      }

      @media (prefers-color-scheme: dark) {
        html,
        body,
        #app-container {
          background: #09090b;
        }
      }

      html.dark,
      body.dark,
      #app-container.dark {
        background: #09090b;
      }
    </style>
  </head>

  <body>
    <div id="app-container"></div>
    <script>
      // Initialize theme before React loads to prevent flash
      (async function initTheme() {
        try {
          const storage = await (chrome.storage || browser.storage).local.get(
            'theme'
          );
          const theme = storage.theme || 'system';
          const isDark =
            theme === 'dark' ||
            (theme === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);

          const elements = [
            document.documentElement,
            document.body,
            document.getElementById('app-container'),
          ];
          if (isDark) {
            elements.forEach((el) => el?.classList.add('dark'));
          } else {
            elements.forEach((el) => el?.classList.remove('dark'));
          }
        } catch (e) {
          console.error('Failed to initialize theme:', e);
        }
      })();
    </script>
  </body>
</html>
