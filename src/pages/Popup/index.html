<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Apple Hide My Email</title>
    <style>
      html,
      body,
      #app-container {
        margin: 0;
        height: 540px;
        max-height: 540px;
        min-height: 100%;
        background: #09090b;
      }

      html.light,
      body.light,
      #app-container.light {
        background: #f4f4f5;
      }

      html.dark,
      body.dark,
      #app-container.dark {
        background: #09090b;
      }
    </style>
  </head>

  <body>
    <div id="app-container"></div>
    <script>
      // Initialize theme before React loads to prevent flash
      (async function initTheme() {
        try {
          const storage = await (chrome.storage || browser.storage).local.get(
            'theme'
          );
          const theme = storage.theme || 'dark';
          const isDark =
            theme === 'dark' ||
            (theme === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);

          const elements = [
            document.documentElement,
            document.body,
            document.getElementById('app-container'),
          ];
          elements.forEach((el) => {
            el?.classList.toggle('dark', isDark);
            el?.classList.toggle('light', !isDark);
          });
        } catch (e) {
          console.error('Failed to initialize theme:', e);
        }
      })();
    </script>
  </body>
</html>
